<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICARON | Premium Quartz Stone Dubai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff; color: #111111; line-height: 1.6; }
        
        /* HEADER */
        header { position: absolute; top: 0; left: 0; width: 100%; z-index: 999; padding: 25px 40px; }
        
        /* HERO */
        .main-hero { height: 80vh; display: flex; align-items: center; justify-content: center; position: relative; background: #000; overflow: hidden; }
        .hero-bg-img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .hero-content { position: relative; z-index: 2; text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 5px; }
        
        /* CATALOG */
        .catalog-section { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
        .filter-tab { background: #fff; border: 1px solid #111; padding: 10px 25px; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; }
        .filter-tab.active { background: #111; color: #fff; }
        
        .stone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .stone-card { cursor: pointer; }
        .card-media { width: 100%; padding-top: 133%; position: relative; background: #f4f4f4; }
        .card-media img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* LIGHTBOX */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 80vh; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 30px; right: 30px; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a href="#">
            <img src="logo.png" alt="MICARON" style="height: 40px; width: auto; mix-blend-mode: difference;">
        </a>
    </header>

    <section class="main-hero">
        <img src="1.png" class="hero-bg-img">
        <div class="hero-content"><h1>Micaron Quartz</h1></div>
    </section>

    <main class="catalog-section">
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterGallery('all', this)">All Surfaces</button>
            <button class="filter-tab" onclick="filterGallery('calacatta', this)">Calacatta</button>
            <button class="filter-tab" onclick="filterGallery('regular', this)">Regular Veins</button>
            <button class="filter-tab" onclick="filterGallery('dark', this)">Dark/Grey</button>
        </div>

        <div class="stone-grid" id="grid"></div>
    </main>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <script>
        const grid = document.getElementById('grid');
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightboxImg');

        const items = [
            ...Array.from({length: 20}, (_, i) => ({cat: 'calacatta', file: `${i+2}.png`})),
            ...Array.from({length: 6}, (_, i) => ({cat: 'regular', file: `${i+22}.png`})),
            ...Array.from({length: 6}, (_, i) => ({cat: 'dark', file: `${i+28}.png`}))
        ];

        function filterGallery(cat, btn) {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            grid.innerHTML = '';
            items.forEach(item => {
                if (cat !== 'all' && item.cat !== cat) return;
                
                const div = document.createElement('div');
                div.className = 'stone-card';
                div.innerHTML = `<div class="card-media"><img src="${item.file}" loading="lazy"></div>`;
                div.onclick = () => { lbImg.src = item.file; lightbox.classList.add('active'); };
                grid.appendChild(div);
            });
        }

        filterGallery('all', document.querySelector('.filter-tab'));
    </script>
</body>
</html>
