        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff; color: #111111; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        
        /* ШАПКА САЙТА */
        header { position: absolute; top: 0; left: 0; width: 100%; z-index: 999; padding: 25px 40px; background: transparent; }
        .header-container { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: flex-start; }
        .logo-link { text-decoration: none; color: #ffffff; display: flex; flex-direction: column; align-items: center; mix-blend-mode: difference; }
        .logo-monogram { font-size: 24px; font-weight: 700; letter-spacing: 2px; margin-bottom: 2px; }
        .logo-text { font-size: 14px; font-weight: 300; text-transform: uppercase; letter-spacing: 5px; }
        
        /* ГЛАВНАЯ СТРАНИЦА (ГАРАНТИРОВАННОЕ ОТОБРАЖЕНИЕ ФОТО) */
        .main-hero { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background-color: #111111;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            overflow: hidden;
        }
        /* Сама картинка как жесткий фон */
        .hero-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        /* Пленка затемнения поверх картинки */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55));
            z-index: 2;
        }
        /* Контент поверх всего */
        .hero-content { 
            position: relative;
            z-index: 3;
            max-width: 800px; 
            animation: fadeIn 1.2s ease-out; 
        }
        .hero-content h1 { font-size: 52px; font-weight: 300; text-transform: uppercase; letter-spacing: 6px; margin-bottom: 20px; line-height: 1.2; }
        .hero-content p { font-size: 18px; font-weight: 300; letter-spacing: 1.5px; color: #f0f0f0; max-width: 600px; margin: 0 auto 40px auto; }
        .hero-btn { 
            display: inline-block; 
            text-decoration: none; 
            color: #ffffff; 
            border: 1px solid #ffffff; 
            padding: 16px 40px; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 400; 
            transition: all 0.4s ease; 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }
        .hero-btn:hover { background: #ffffff; color: #111111; transform: translateY(-2px); }
        
        /* КАТАЛОГ СЕКЦИЯ */
        .catalog-section { padding-top: 100px; }
        .hero-section { padding: 40px 20px 20px 20px; text-align: center; max-width: 1400px; margin: 0 auto; }
        .hero-section h2 { font-size: 32px; font-weight: 300; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 15px; }
        .hero-section p { font-size: 16px; color: #666666; max-width: 600px; margin: 0 auto; font-weight: 300; }
