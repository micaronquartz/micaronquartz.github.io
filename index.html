<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICARON | Premium Quartz Stone Dubai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #e0e0e0; line-height: 1.6; scroll-behavior: smooth; }
        
        /* Исправленная шапка для мобильных */
        header { position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; padding: 20px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); }
        .logo-container { cursor: pointer; }
        .logo-img { height: 35px; width: auto; display: block; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        
        @media (max-width: 600px) {
            header { padding: 15px 10px; }
            .nav-links { gap: 8px; }
            .nav-links a { font-size: 9px; }
        }

        #modal { display: none; position: fixed; z-index: 20000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; cursor: pointer; }
        #modal img { max-width: 90%; max-height: 90%; border: 2px solid #fff; }
        
        .main-hero { height: 80vh; display: flex; align-items: center; justify-content: center; position: relative; background: #000; overflow: hidden; }
        .hero-bg-img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .hero-content { position: relative; z-index: 2; text-align: center; color: #fff; padding: 0 20px; }
        .hero-content h1 { letter-spacing: 5px; font-size: 32px; margin-bottom: 10px; }
        
        .catalog-section { padding: 50px 20px; max-width: 1200px; margin: 0 auto; }
        .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-tab { background: transparent; border: 1px solid #444; color: #ccc; padding: 8px 15px; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        .filter-tab.active { background: #fff; color: #000; }
        
        .stone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .stone-card { cursor: pointer; border: 1px solid #333; background: #222; }
        .card-media { width: 100%; padding-top: 133%; position: relative; }
        .card-media img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background-color: #25D366; color: #fff; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-size: 12px; font-weight: bold; z-index: 9999; }
    </style>
</head>
<body>

    <div id="modal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

    <header id="top">
        <a href="#top" class="logo-container"><img src="logo.png" alt="MICARON" class="logo-img"></a>
        <nav class="nav-links">
            <a href="#catalog">Catalog</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contacts">Contacts</a>
        </nav>
    </header>

    <section class="main-hero">
        <img src="1.png" class="hero-bg-img" alt="Micaron Quartz">
        <div class="hero-content">
            <h1>Micaron Quartz</h1>
            <p>Official Representative in the UAE & GCC</p>
        </div>
    </section>

    <main id="catalog" class="catalog-section">
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterGallery('all', this)">All</button>
            <button class="filter-tab" onclick="filterGallery('calacatta', this)">Calacatta</button>
            <button class="filter-tab" onclick="filterGallery('regular', this)">Regular</button>
            <button class="filter-tab" onclick="filterGallery('dark', this)">Dark</button>
        </div>
        <div class="stone-grid" id="grid"></div>
    </main>

    <a href="https://wa.me/971585865577" target="_blank" class="whatsapp-float">Chat with us</a>

    <script>
        const grid = document.getElementById('grid');
        const allItems = [
            { cat: 'calacatta', file: '2.png' }, { cat: 'calacatta', file: '3.png' }, { cat: 'calacatta', file: '4.png' },
            { cat: 'regular', file: '22.png' }, { cat: 'regular', file: '23.png' }, { cat: 'dark', file: '28.png' }
        ];
        function filterGallery(cat, btn) {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            grid.innerHTML = '';
            const filtered = cat === 'all' ? allItems : allItems.filter(item => item.cat === cat);
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'stone-card';
                card.innerHTML = `<div class="card-media"><img src="${item.file}" loading="lazy"></div>`;
                card.onclick = () => { document.getElementById('modal').style.display = 'flex'; document.getElementById('modalImg').src = item.file; };
                grid.appendChild(card);
            });
        }
        filterGallery('all', document.querySelector('.filter-tab'));
    </script>
</body>
</html>
