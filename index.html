<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICARON | Premium Quartz Stone Dubai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #e0e0e0; line-height: 1.6; scroll-behavior: smooth; }
        header { padding: 25px 40px; display: flex; justify-content: space-between; background: #000; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; margin-left: 20px; }
        .info-section { padding: 80px 20px; max-width: 1000px; margin: 0 auto; color: #bbb; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .service-card { border: 1px solid #333; padding: 30px 20px; text-align: center; background: #222; }
    </style>
</head>
<body>
    <header>
        <nav class="nav-links">
            <a href="#about">About Us</a>
            <a href="#services">Services</a>
            <a href="#certificates">Certificates</a>
            <a href="#contacts">Contacts</a>
        </nav>
    </header>

    <section id="about" class="info-section">
        <h2>About Us</h2>
        <p>Official representative of a world-class premium quartz factory. Certified by NSF, Greenguard, and RoHS 2.0.</p>
    </section>

    <section id="services" class="info-section">
        <h2>Our Services</h2>
        <div class="services-grid">
            <div class="service-card"><h3>Consultation</h3></div>
            <div class="service-card"><h3>Measurement</h3></div>
            <div class="service-card"><h3>Fabrication</h3></div>
            <div class="service-card"><h3>Installation</h3></div>
        </div>
    </section>
</body>
</html>
